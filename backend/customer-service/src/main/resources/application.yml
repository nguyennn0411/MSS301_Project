server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: customer-service
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3311/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
